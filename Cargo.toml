[package]
name = "project_nadziratel"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
image = "0.25.10"
imageproc = "0.27.0"
my_utils = { path = "../my_utils" }
oar-ocr = { version = "0.9.0" }
serenity = "0.12.5"
strsim = "0.11.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
